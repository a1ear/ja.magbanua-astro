# Netlify build settings. With this file in the repo, Netlify ignores the
# build fields in its UI and uses these instead. vercel.json is the Vercel
# equivalent; keep the two in step.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12 or newer; Netlify's default can be older.
  NODE_VERSION = "22"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
